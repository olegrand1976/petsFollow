substitutions:
  _AR_REGION: europe-west1
  _RUN_REGION: europe-west9
  _AR_REPO: petsfollow
  _SERVICE_ACCOUNT: petsfollow-run
  _VPC_CONNECTOR: premedica-connector
  _CLOUDSQL_INSTANCE: premedica-prod-2025:europe-west9:premedica-db-staging
  _API_SERVICE: petsfollow-api
  _FRONTEND_SERVICE: petsfollow-nuxtjs
  _ORTHANC_SERVICE: petsfollow-orthanc
  _SKIP_MIGRATE: "false"
  # true = skip Orthanc image + deploy (API/Nuxt PACS stays off without URL).
  _SKIP_ORTHANC: "false"

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build-api
    name: gcr.io/kaniko-project/executor:latest
    args:
      - --destination=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$BUILD_ID
      - --destination=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:latest
      - --cache=true
      - --context=dir://.
      - --dockerfile=deploy/Dockerfile.api

  - id: build-frontend
    name: gcr.io/kaniko-project/executor:latest
    args:
      - --destination=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/nuxtjs:$BUILD_ID
      - --destination=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/nuxtjs:latest
      - --cache=true
      - --context=dir://.
      - --dockerfile=deploy/Dockerfile.nuxtjs
      # CSP connect-src : API publique (jamais localhost bake).
      - --build-arg=NUXT_PUBLIC_API_BASE=https://api.petsfollow.ll-it-sc.be
      - --build-arg=NUXT_PUBLIC_APP_ENV=staging
      # Modules Pro tag « dev » (nav + pages) — mirror make nuxtjs-dev.
      - --build-arg=NUXT_PUBLIC_PHARMACY_ENABLED=true
      - --build-arg=NUXT_PUBLIC_BILLIT_ENABLED=true
      - --build-arg=NUXT_PUBLIC_PRESCRIPTIONS_ENABLED=true
      # PACS : bake off ; runtime enable via deploy-frontend when Orthanc URL present.
      - --build-arg=NUXT_PUBLIC_PACS_ENABLED=false

  # :debug = busybox présent (/busybox/sh). :latest n'a plus de shell → OCI create fail.
  - id: build-orthanc
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: /busybox/sh
    args:
      - -c
      - |
        if [ "${_SKIP_ORTHANC}" = "true" ]; then
          echo "→ Orthanc build ignoré (_SKIP_ORTHANC=true)"
          exit 0
        fi
        exec /kaniko/executor \
          --destination=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/orthanc:$BUILD_ID \
          --destination=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/orthanc:latest \
          --cache=true \
          --context=dir://. \
          --dockerfile=deploy/Dockerfile.orthanc

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_SKIP_MIGRATE}" == "true" ]]; then
          echo "→ Migrations ignorées (_SKIP_MIGRATE=true)"
          exit 0
        fi
        IMAGE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$BUILD_ID"
        SA="${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com"
        CONNECTOR="projects/$PROJECT_ID/locations/${_RUN_REGION}/connectors/${_VPC_CONNECTOR}"
        source infra/gcp/lib/gcp-env.sh
        source infra/gcp/lib/deploy-run-args.sh
        export GCP_PROJECT_ID="$PROJECT_ID" GCP_RUN_REGION="${_RUN_REGION}"
        ENV_FILE="$$(mktemp)"
        pf_write_api_env_file "$$ENV_FILE"
        MIGRATE_SECRETS="$$(pf_migrate_secrets)"
        gcloud run jobs deploy petsfollow-migrate \
          --project="$PROJECT_ID" --image="$$IMAGE" --region="${_RUN_REGION}" \
          --service-account="$$SA" \
          --set-cloudsql-instances="${_CLOUDSQL_INSTANCE}" \
          --vpc-connector="$$CONNECTOR" --vpc-egress=private-ranges-only \
          --env-vars-file="$$ENV_FILE" \
          --set-secrets="$$MIGRATE_SECRETS" \
          --command=/app/petsfollow-api --args=migrate \
          --memory=512Mi --cpu=1 --task-timeout=600 --max-retries=0 --quiet
        gcloud run jobs execute petsfollow-migrate \
          --project="$PROJECT_ID" --region="${_RUN_REGION}" --wait --quiet
    waitFor: ["build-api"]

  - id: deploy-orthanc
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_SKIP_ORTHANC}" == "true" ]]; then
          echo "→ Orthanc ignoré (_SKIP_ORTHANC=true)"
          exit 0
        fi
        source infra/gcp/lib/gcp-env.sh
        export GCP_PROJECT_ID="$PROJECT_ID" GCP_RUN_REGION="${_RUN_REGION}"
        export ORTHANC_SERVICE="${_ORTHANC_SERVICE}"
        IMAGE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/orthanc:$BUILD_ID"
        # Best-effort : module tag « dev » — un échec Orthanc ne bloque pas API/Nuxt.
        # setup-orthanc auto-passe en --deploy-only si déjà bootstrappé (pas de reset SQL).
        if ! bash infra/gcp/setup-orthanc.sh "$$IMAGE"; then
          echo "WARN: deploy Orthanc échoué — PACS restera off (PACS_ORTHANC_URL vide)" >&2
          exit 0
        fi
    waitFor: ["build-orthanc"]

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$BUILD_ID"
        SA="${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com"
        CONNECTOR="projects/$PROJECT_ID/locations/${_RUN_REGION}/connectors/${_VPC_CONNECTOR}"
        source infra/gcp/lib/gcp-env.sh
        source infra/gcp/lib/deploy-run-args.sh
        export GCP_PROJECT_ID="$PROJECT_ID" GCP_RUN_REGION="${_RUN_REGION}"
        export ORTHANC_SERVICE="${_ORTHANC_SERVICE}"
        # Wire PACS when Orthanc Cloud Run is up (from this build or a prior one).
        export PACS_ORTHANC_URL="$$(orthanc_run_url)"
        if [[ -n "$${PACS_ORTHANC_URL}" ]]; then
          echo "→ PACS_ORTHANC_URL=$${PACS_ORTHANC_URL}"
        else
          echo "→ Orthanc URL absent — PACS_ENABLED reste off"
        fi
        ENV_FILE="$$(mktemp)"
        # false=DEV_SEED, true=ADMIN_STAGING_SEED, staging=APP_ENV (API staging only)
        pf_write_api_env_file "$$ENV_FILE" false true staging
        SECRETS="$$(pf_api_secrets)"
        # timeout 900s : WebSocket Gemini Live (appel pitch 8 min + marge)
        gcloud run deploy ${_API_SERVICE} \
          --project="$PROJECT_ID" --image="$$IMAGE" --region="${_RUN_REGION}" \
          --service-account="$$SA" --allow-unauthenticated --port=8080 \
          --memory=1Gi --cpu=1 --concurrency=80 --min-instances=0 --max-instances=10 --timeout=900 \
          --set-cloudsql-instances="${_CLOUDSQL_INSTANCE}" \
          --vpc-connector="$$CONNECTOR" --vpc-egress=private-ranges-only \
          --env-vars-file="$$ENV_FILE" \
          --set-secrets="$$SECRETS" \
          --quiet
        gcloud run services add-iam-policy-binding ${_API_SERVICE} \
          --project="$PROJECT_ID" --region="${_RUN_REGION}" \
          --member=allUsers --role=roles/run.invoker \
          --quiet 2>/dev/null || true
        gcloud run services describe ${_API_SERVICE} --region="${_RUN_REGION}" --format='value(status.url)'
    waitFor: ["migrate", "deploy-orthanc"]

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/nuxtjs:$BUILD_ID"
        SA="${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com"
        source infra/gcp/lib/gcp-env.sh
        source infra/gcp/lib/deploy-run-args.sh
        export GCP_PROJECT_ID="$PROJECT_ID" GCP_RUN_REGION="${_RUN_REGION}"
        export ORTHANC_SERVICE="${_ORTHANC_SERVICE}"
        export PACS_ORTHANC_URL="$$(orthanc_run_url)"
        API_URL="$$(gcloud run services describe ${_API_SERVICE} \
          --region="${_RUN_REGION}" --project="$PROJECT_ID" \
          --format='value(status.url)' 2>/dev/null || true)"
        if [[ -z "$$API_URL" ]]; then
          API_URL="$${PUBLIC_API_URL}"
        fi
        ENV_FILE="$$(mktemp)"
        pf_write_frontend_env_file "$$ENV_FILE" "$$API_URL" "staging"
        gcloud run deploy ${_FRONTEND_SERVICE} \
          --project="$PROJECT_ID" --image="$$IMAGE" --region="${_RUN_REGION}" \
          --service-account="$$SA" --allow-unauthenticated --port=3000 \
          --memory=1Gi --cpu=1 --concurrency=20 --min-instances=0 --max-instances=10 --timeout=300 \
          --env-vars-file="$$ENV_FILE" \
          --quiet
        gcloud run services add-iam-policy-binding ${_FRONTEND_SERVICE} \
          --project="$PROJECT_ID" --region="${_RUN_REGION}" \
          --member=allUsers --role=roles/run.invoker \
          --quiet 2>/dev/null || true
        gcloud run services describe ${_FRONTEND_SERVICE} --region="${_RUN_REGION}" --format='value(status.url)'
    waitFor: ["build-frontend", "deploy-api"]

