# Cloud Build — petsFollow **production** (APP_ENV=production, seed off).
# Déclenché par .github/workflows/deploy-gcp-prod.yml (workflow_dispatch jusqu’à activation main).
#
# Prérequis : secrets SM prod, Cloud SQL réel (remplacer FIXME), DNS petsfollow.app,
#             source gcp-env-prod.sh (services *-prod).
#
# Ne pas confondre avec infra/gcp/cloudbuild.yaml (staging).

substitutions:
  _AR_REGION: europe-west1
  _RUN_REGION: europe-west9
  _AR_REPO: petsfollow
  _SERVICE_ACCOUNT: petsfollow-run
  _VPC_CONNECTOR: premedica-connector
  # Remplacer avant le 1er deploy prod (interdit : premedica-db-staging).
  # Secrets SM : provisionner des versions prod (DATABASE_URL ≠ staging) avant go-live.
  _CLOUDSQL_INSTANCE: premedica-prod-2025:europe-west9:FIXME-petsfollow-db-prod
  _API_SERVICE: petsfollow-api-prod
  _FRONTEND_SERVICE: petsfollow-nuxtjs-prod
  _SKIP_MIGRATE: "false"
  _PUBLIC_API_URL: https://api.petsfollow.app
  _PUBLIC_SITE_URL: https://petsfollow.app

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: guard-sql
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_CLOUDSQL_INSTANCE}" == *FIXME* ]]; then
          echo "ERROR: _CLOUDSQL_INSTANCE still contains FIXME — provision prod SQL first." >&2
          echo "  See documentation/10-GCP-DEPLOIEMENT.md § Production (main)." >&2
          exit 1
        fi
        if [[ "${_CLOUDSQL_INSTANCE}" == *premedica-db-staging* ]]; then
          echo "ERROR: refuse staging SQL instance for production deploy." >&2
          exit 1
        fi

  - id: build-api
    name: gcr.io/kaniko-project/executor:latest
    args:
      - --destination=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$BUILD_ID
      - --destination=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:prod
      - --cache=true
      - --context=dir://.
      - --dockerfile=deploy/Dockerfile.api
    waitFor: ["guard-sql"]

  - id: build-frontend
    name: gcr.io/kaniko-project/executor:latest
    args:
      - --destination=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/nuxtjs:$BUILD_ID
      - --destination=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/nuxtjs:prod
      - --cache=true
      - --context=dir://.
      - --dockerfile=deploy/Dockerfile.nuxtjs
      - --build-arg=NUXT_PUBLIC_API_BASE=https://api.petsfollow.app
      - --build-arg=NUXT_PUBLIC_APP_ENV=production
      # Modules tag « dev » : off en prod (opt-in explicite via env Run si besoin).
    waitFor: ["guard-sql"]

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_SKIP_MIGRATE}" == "true" ]]; then
          echo "→ Migrations ignorées (_SKIP_MIGRATE=true)"
          exit 0
        fi
        IMAGE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$BUILD_ID"
        SA="${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com"
        CONNECTOR="projects/$PROJECT_ID/locations/${_RUN_REGION}/connectors/${_VPC_CONNECTOR}"
        source infra/gcp/lib/gcp-env.sh
        source infra/gcp/lib/gcp-env-prod.sh
        source infra/gcp/lib/deploy-run-args.sh
        export GCP_PROJECT_ID="$PROJECT_ID" GCP_RUN_REGION="${_RUN_REGION}"
        export PUBLIC_API_URL="${_PUBLIC_API_URL}" PUBLIC_SITE_URL="${_PUBLIC_SITE_URL}"
        ENV_FILE="$$(mktemp)"
        # production : seed off, admin staging seed off
        pf_write_api_env_file "$$ENV_FILE" false false production
        MIGRATE_SECRETS="$$(pf_migrate_secrets)"
        gcloud run jobs deploy petsfollow-migrate-prod \
          --project="$PROJECT_ID" --image="$$IMAGE" --region="${_RUN_REGION}" \
          --service-account="$$SA" \
          --set-cloudsql-instances="${_CLOUDSQL_INSTANCE}" \
          --vpc-connector="$$CONNECTOR" --vpc-egress=private-ranges-only \
          --env-vars-file="$$ENV_FILE" \
          --set-secrets="$$MIGRATE_SECRETS" \
          --command=/app/petsfollow-api --args=migrate \
          --memory=512Mi --cpu=1 --task-timeout=600 --max-retries=0 --quiet
        gcloud run jobs execute petsfollow-migrate-prod \
          --project="$PROJECT_ID" --region="${_RUN_REGION}" --wait --quiet
    waitFor: ["build-api"]

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$BUILD_ID"
        SA="${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com"
        CONNECTOR="projects/$PROJECT_ID/locations/${_RUN_REGION}/connectors/${_VPC_CONNECTOR}"
        source infra/gcp/lib/gcp-env.sh
        source infra/gcp/lib/gcp-env-prod.sh
        source infra/gcp/lib/deploy-run-args.sh
        export GCP_PROJECT_ID="$PROJECT_ID" GCP_RUN_REGION="${_RUN_REGION}"
        export PUBLIC_API_URL="${_PUBLIC_API_URL}" PUBLIC_SITE_URL="${_PUBLIC_SITE_URL}"
        ENV_FILE="$$(mktemp)"
        pf_write_api_env_file "$$ENV_FILE" false false production
        SECRETS="$$(pf_api_secrets)"
        gcloud run deploy ${_API_SERVICE} \
          --project="$PROJECT_ID" --image="$$IMAGE" --region="${_RUN_REGION}" \
          --service-account="$$SA" --allow-unauthenticated --port=8080 \
          --memory=1Gi --cpu=1 --concurrency=80 --min-instances=0 --max-instances=10 --timeout=900 \
          --set-cloudsql-instances="${_CLOUDSQL_INSTANCE}" \
          --vpc-connector="$$CONNECTOR" --vpc-egress=private-ranges-only \
          --env-vars-file="$$ENV_FILE" \
          --set-secrets="$$SECRETS" \
          --quiet
        gcloud run services add-iam-policy-binding ${_API_SERVICE} \
          --project="$PROJECT_ID" --region="${_RUN_REGION}" \
          --member=allUsers --role=roles/run.invoker \
          --quiet 2>/dev/null || true
        gcloud run services describe ${_API_SERVICE} --region="${_RUN_REGION}" --format='value(status.url)'
    waitFor: ["migrate"]

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/nuxtjs:$BUILD_ID"
        SA="${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com"
        source infra/gcp/lib/gcp-env.sh
        source infra/gcp/lib/gcp-env-prod.sh
        source infra/gcp/lib/deploy-run-args.sh
        export GCP_PROJECT_ID="$PROJECT_ID" GCP_RUN_REGION="${_RUN_REGION}"
        export PUBLIC_API_URL="${_PUBLIC_API_URL}" PUBLIC_SITE_URL="${_PUBLIC_SITE_URL}"
        API_URL="$$(gcloud run services describe ${_API_SERVICE} \
          --region="${_RUN_REGION}" --project="$PROJECT_ID" \
          --format='value(status.url)' 2>/dev/null || true)"
        if [[ -z "$$API_URL" ]]; then
          API_URL="${_PUBLIC_API_URL}"
        fi
        ENV_FILE="$$(mktemp)"
        pf_write_frontend_env_file "$$ENV_FILE" "$$API_URL" "production"
        gcloud run deploy ${_FRONTEND_SERVICE} \
          --project="$PROJECT_ID" --image="$$IMAGE" --region="${_RUN_REGION}" \
          --service-account="$$SA" --allow-unauthenticated --port=3000 \
          --memory=1Gi --cpu=1 --concurrency=20 --min-instances=0 --max-instances=10 --timeout=300 \
          --env-vars-file="$$ENV_FILE" \
          --quiet
        gcloud run services add-iam-policy-binding ${_FRONTEND_SERVICE} \
          --project="$PROJECT_ID" --region="${_RUN_REGION}" \
          --member=allUsers --role=roles/run.invoker \
          --quiet 2>/dev/null || true
        gcloud run services describe ${_FRONTEND_SERVICE} --region="${_RUN_REGION}" --format='value(status.url)'
    waitFor: ["build-frontend", "deploy-api"]
