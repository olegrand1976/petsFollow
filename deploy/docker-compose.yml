services:
  db:
    # pgvector required for rag.* (AI CR advanced knowledge base).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: petsfollow
      POSTGRES_PASSWORD: petsfollow
      POSTGRES_DB: petsfollow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petsfollow -d petsfollow"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${PETSFOLLOW_DB_PORT:-5435}:5432"

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${PETSFOLLOW_REDIS_PORT:-6382}:6379"

  mailhog:
    image: mailhog/mailhog
    ports:
      - "${PETSFOLLOW_MAILHOG_SMTP_PORT:-1027}:1025"
      - "${PETSFOLLOW_MAILHOG_UI_PORT:-8027}:8025"

  # PACS local (filesystem) — config = infra/orthanc/orthanc.local.json (seule source).
  # Bind loopback only (mdp démo) ; port hôte PETSFOLLOW_ORTHANC_PORT.
  orthanc:
    image: orthancteam/orthanc:24.12.0
    ports:
      - "127.0.0.1:${PETSFOLLOW_ORTHANC_PORT:-8042}:8042"
    volumes:
      - ../infra/orthanc/orthanc.local.json:/etc/orthanc/petsfollow-local.json:ro
      - orthancdata:/var/lib/orthanc/db
    environment:
      VERBOSE_ENABLED: "true"
    # Image Orthanc sans curl/wget — python3 est présent.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; p=urllib.request.HTTPPasswordMgrWithDefaultRealm(); p.add_password(None,'http://127.0.0.1:8042/','petsfollow','petsfollow'); urllib.request.build_opener(urllib.request.HTTPBasicAuthHandler(p)).open('http://127.0.0.1:8042/system').read()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    command: ["migrate"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://petsfollow:petsfollow@db:5432/petsfollow?sslmode=disable
      MIGRATE_ON_BOOT: "true"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://petsfollow:petsfollow@db:5432/petsfollow?sslmode=disable
      REDIS_ADDR: redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      HTTP_ADDR: ":8080"
      MIGRATE_ON_BOOT: "true"
      DEV_SEED_ENABLED: "true"
      # Stack locale (mailhog, mdp démo) — même défaut que make api-dev ; le
      # garde-fou seed (env_guard.go) refuse de tourner sans APP_ENV seedable.
      APP_ENV: "${APP_ENV:-local}"
      BILLING_MOCK_ENABLED: "${BILLING_MOCK_ENABLED:-true}"
      # Modules tag `dev` — parity make api-dev si absents du .env.
      PHARMACY_ENABLED: "${PHARMACY_ENABLED:-true}"
      PRESCRIPTIONS_ENABLED: "${PRESCRIPTIONS_ENABLED:-true}"
      BILLIT_ENABLED: "${BILLIT_ENABLED:-true}"
      PACS_ENABLED: "${PACS_ENABLED:-true}"
      RESEARCH_ENABLED: "${RESEARCH_ENABLED:-true}"
      CLIENT_AI_ENABLED: "${CLIENT_AI_ENABLED:-true}"
    ports:
      - "${PETSFOLLOW_API_PORT:-8291}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nuxtjs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nuxtjs
      args:
        NUXT_PUBLIC_API_BASE: http://api:8080
        # Local `make up` = parity make nuxtjs-dev (modules tag `dev` on).
        # Prod/staging Cloud Build passe false ou true explicitement.
        NUXT_PUBLIC_APP_ENV: ${NUXT_PUBLIC_APP_ENV:-local}
        NUXT_PUBLIC_PHARMACY_ENABLED: ${NUXT_PUBLIC_PHARMACY_ENABLED:-true}
        NUXT_PUBLIC_BILLIT_ENABLED: ${NUXT_PUBLIC_BILLIT_ENABLED:-true}
        NUXT_PUBLIC_PRESCRIPTIONS_ENABLED: ${NUXT_PUBLIC_PRESCRIPTIONS_ENABLED:-true}
        NUXT_PUBLIC_PACS_ENABLED: ${NUXT_PUBLIC_PACS_ENABLED:-true}
        NUXT_PUBLIC_RESEARCH_ENABLED: ${NUXT_PUBLIC_RESEARCH_ENABLED:-true}
        NUXT_PUBLIC_SITES_UI_ENABLED: ${NUXT_PUBLIC_SITES_UI_ENABLED:-true}
    environment:
      NUXT_PUBLIC_API_BASE: http://api:8080
      NUXT_PUBLIC_APP_ENV: ${NUXT_PUBLIC_APP_ENV:-local}
      NUXT_PUBLIC_PHARMACY_ENABLED: ${NUXT_PUBLIC_PHARMACY_ENABLED:-true}
      NUXT_PUBLIC_BILLIT_ENABLED: ${NUXT_PUBLIC_BILLIT_ENABLED:-true}
      NUXT_PUBLIC_PRESCRIPTIONS_ENABLED: ${NUXT_PUBLIC_PRESCRIPTIONS_ENABLED:-true}
      NUXT_PUBLIC_PACS_ENABLED: ${NUXT_PUBLIC_PACS_ENABLED:-true}
      NUXT_PUBLIC_RESEARCH_ENABLED: ${NUXT_PUBLIC_RESEARCH_ENABLED:-true}
      NUXT_PUBLIC_SITES_UI_ENABLED: ${NUXT_PUBLIC_SITES_UI_ENABLED:-true}
      NITRO_PORT: "3000"
    ports:
      - "${PETSFOLLOW_NUXTJS_PORT:-3002}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  orthancdata:
