name: Product digest ingest

# Collects today's commits and posts them to the API for Gemini functional summarization.
# Cloud Scheduler (18:00 Europe/Brussels) then triggers /internal/product-digest/run to send emails.
# Matrix: staging (branch staging) + production (branch main) when prod secrets are set.

on:
  schedule:
    # 16:45 UTC ≈ 17:45/18:45 Brussels (CET/CEST). Prefer before 18:00 Brussels send.
    - cron: "45 15 * * *"
  workflow_dispatch:
    inputs:
      since_hours:
        description: "Lookback window in hours"
        required: false
        default: "24"
      date:
        description: "Digest date YYYY-MM-DD (Brussels), empty = today"
        required: false
        default: ""
      branch:
        description: "Git branch override (empty = matrix default)"
        required: false
        default: ""
      environment:
        description: "Environment label override (empty = matrix default)"
        required: false
        default: ""

jobs:
  ingest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: staging
            branch: staging
            environment: staging
            api_secret: PRODUCT_DIGEST_API_URL
            digest_secret: PRODUCT_DIGEST_SECRET
          - target: production
            branch: main
            environment: production
            api_secret: PRODUCT_DIGEST_API_URL_PROD
            digest_secret: PRODUCT_DIGEST_SECRET_PROD
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch || matrix.branch }}

      - name: Build commit payload and ingest (${{ matrix.target }})
        env:
          API_URL: ${{ secrets[matrix.api_secret] }}
          DIGEST_SECRET: ${{ secrets[matrix.digest_secret] }}
          SINCE_HOURS: ${{ github.event.inputs.since_hours || '24' }}
          DIGEST_DATE: ${{ github.event.inputs.date || '' }}
          DIGEST_BRANCH: ${{ github.event.inputs.branch || matrix.branch }}
          DIGEST_ENVIRONMENT: ${{ github.event.inputs.environment || matrix.environment }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ -z "${API_URL:-}" || -z "${DIGEST_SECRET:-}" ]]; then
            echo "Missing ${TARGET} digest secrets (${{ matrix.api_secret }} / ${{ matrix.digest_secret }}) — skip."
            exit 0
          fi

          python3 <<'PY'
          import json, os, subprocess, urllib.request

          since_hours = os.environ.get("SINCE_HOURS") or "24"
          digest_date = (os.environ.get("DIGEST_DATE") or "").strip()
          branch = (os.environ.get("DIGEST_BRANCH") or "").strip() or "staging"
          environment = (os.environ.get("DIGEST_ENVIRONMENT") or "").strip() or branch
          api = os.environ["API_URL"].rstrip("/")
          secret = os.environ["DIGEST_SECRET"]

          try:
              head_branch = subprocess.check_output(
                  ["git", "rev-parse", "--abbrev-ref", "HEAD"],
                  text=True,
                  errors="replace",
              ).strip()
              if head_branch and head_branch != "HEAD":
                  branch = head_branch
          except Exception:
              pass

          log = subprocess.check_output(
              [
                  "git", "log",
                  f"--since={since_hours} hours ago",
                  "--pretty=format:%H%x1f%s%x1f%b%x1f%an%x1e",
              ],
              text=True,
              errors="replace",
          )
          commits = []
          for entry in log.split("\x1e"):
              entry = entry.strip("\n")
              if not entry.strip():
                  continue
              parts = entry.split("\x1f", 3)
              if len(parts) < 2:
                  continue
              sha, subject = parts[0], parts[1]
              body = parts[2] if len(parts) > 2 else ""
              author = parts[3] if len(parts) > 3 else ""
              commits.append({
                  "sha": sha[:12],
                  "subject": subject.strip(),
                  "body": body.strip()[:800],
                  "author": author.strip(),
              })

          payload = {
              "commits": commits,
              "branch": branch,
              "environment": environment,
          }
          if digest_date:
              payload["date"] = digest_date

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              f"{api}/api/v1/internal/product-digest/ingest",
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "X-Product-Digest-Secret": secret,
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=120) as resp:
              print(resp.read().decode())
          print(f"Ingested {len(commits)} commit(s) from branch={branch} env={environment} target={os.environ.get('TARGET')}")
          PY
