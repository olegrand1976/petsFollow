name: Deploy GCP staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-petsfollow-gcp
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: premedica-prod-2025
  GCP_RUN_REGION: europe-west9
  PETSFOLLOW_PUBLIC_SITE_URL: https://petsfollow.ll-it-sc.be
  PETSFOLLOW_API_PUBLIC_URL: https://api.petsfollow.ll-it-sc.be
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/237481297060/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  GCP_SERVICE_ACCOUNT: github-petsfollow-deploy@premedica-prod-2025.iam.gserviceaccount.com

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Cloud Build → petsFollow API + Nuxt
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Deploy (Cloud Build)
        run: |
          chmod +x infra/gcp/*.sh infra/gcp/lib/*.sh 2>/dev/null || true
          gcloud builds submit --config=infra/gcp/cloudbuild.yaml --project="${GCP_PROJECT_ID}" .
      - name: Postdeploy (jobs + smoke, sans seed)
        # Seed staging : Cloud Scheduler dimanche 08:00 Europe/Brussels (setup-seed-scheduler.sh).
        # Reset manuel : bash infra/gcp/postdeploy.sh --seed
        run: bash infra/gcp/postdeploy.sh
      - name: Summary
        run: |
          API_URL="$(gcloud run services describe petsfollow-api             --region="${GCP_RUN_REGION}" --project="${GCP_PROJECT_ID}"             --format='value(status.url)' 2>/dev/null || true)"
          FE_URL="$(gcloud run services describe petsfollow-nuxtjs             --region="${GCP_RUN_REGION}" --project="${GCP_PROJECT_ID}"             --format='value(status.url)' 2>/dev/null || true)"
          {
            echo "### petsFollow GCP"
            echo ""
            echo "| Service | URL |"
            echo "|---------|-----|"
            echo "| Site | ${PETSFOLLOW_PUBLIC_SITE_URL} |"
            echo "| API custom | ${PETSFOLLOW_API_PUBLIC_URL} |"
            echo "| API Run | ${API_URL} |"
            echo "| Frontend Run | ${FE_URL} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  playwright:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: nuxtjs
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium
      - name: E2E P0+P1 against Cloud Run frontend
        env:
          CI: true
          # Specs API-direct (ex. 09-pet-detail) — ne pas laisser le défaut localhost:8291.
          PETSFOLLOW_API_URL: ${{ env.PETSFOLLOW_API_PUBLIC_URL }}
          NUXT_PUBLIC_API_BASE: ${{ env.PETSFOLLOW_API_PUBLIC_URL }}
        run: |
          FE_URL="${PETSFOLLOW_PUBLIC_SITE_URL}"
          if ! curl -fsS --max-time 10 "${FE_URL}/" >/dev/null 2>&1; then
            FE_URL="$(gcloud run services describe petsfollow-nuxtjs --region="${GCP_RUN_REGION}" --project="${GCP_PROJECT_ID}" --format='value(status.url)')"
          fi
          # Suite complète web Pro (auth → commercial → team). Specs flaky : tag @flaky hors gate.
          echo "PLAYWRIGHT_BASE_URL=${FE_URL} PETSFOLLOW_API_URL=${PETSFOLLOW_API_URL}"
          PLAYWRIGHT_BASE_URL="${FE_URL}" npx playwright test --grep-invert @flaky
