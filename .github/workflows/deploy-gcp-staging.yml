name: Deploy GCP staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-petsfollow-gcp
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: premedica-prod-2025
  GCP_RUN_REGION: europe-west9
  PETSFOLLOW_PUBLIC_SITE_URL: https://petsfollow.ll-it-sc.be
  PETSFOLLOW_API_PUBLIC_URL: https://api.petsfollow.ll-it-sc.be
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/237481297060/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  GCP_SERVICE_ACCOUNT: github-petsfollow-deploy@premedica-prod-2025.iam.gserviceaccount.com

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Cloud Build → petsFollow API + Nuxt
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Deploy (Cloud Build)
        run: |
          chmod +x infra/gcp/*.sh infra/gcp/lib/*.sh 2>/dev/null || true
          gcloud builds submit --config=infra/gcp/cloudbuild.yaml --project="${GCP_PROJECT_ID}" .
      - name: Postdeploy (jobs + smoke, sans seed)
        # Seed staging : manuel uniquement (admin Pro « RESET STAGING » ou postdeploy.sh --seed).
        # Purge quality déléguée au job cleanup-quality (if: always()) — pas de double purge ici.
        env:
          PF_SKIP_QUALITY_CLEANUP: "1"
        run: bash infra/gcp/postdeploy.sh
      - name: Summary
        run: |
          API_URL="$(gcloud run services describe petsfollow-api             --region="${GCP_RUN_REGION}" --project="${GCP_PROJECT_ID}"             --format='value(status.url)' 2>/dev/null || true)"
          FE_URL="$(gcloud run services describe petsfollow-nuxtjs             --region="${GCP_RUN_REGION}" --project="${GCP_PROJECT_ID}"             --format='value(status.url)' 2>/dev/null || true)"
          {
            echo "### petsFollow GCP"
            echo ""
            echo "| Service | URL |"
            echo "|---------|-----|"
            echo "| Site | ${PETSFOLLOW_PUBLIC_SITE_URL} |"
            echo "| API custom | ${PETSFOLLOW_API_PUBLIC_URL} |"
            echo "| API Run | ${API_URL} |"
            echo "| Frontend Run | ${FE_URL} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  playwright:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: nuxtjs
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium
      - name: E2E P0+P1 against Cloud Run frontend
        env:
          CI: true
          # Specs API-direct (ex. 09-pet-detail) — ne pas laisser le défaut localhost:8291.
          PETSFOLLOW_API_URL: ${{ env.PETSFOLLOW_API_PUBLIC_URL }}
          NUXT_PUBLIC_API_BASE: ${{ env.PETSFOLLOW_API_PUBLIC_URL }}
        run: |
          FE_URL="${PETSFOLLOW_PUBLIC_SITE_URL}"
          if ! curl -fsS --max-time 10 "${FE_URL}/" >/dev/null 2>&1; then
            FE_URL="$(gcloud run services describe petsfollow-nuxtjs --region="${GCP_RUN_REGION}" --project="${GCP_PROJECT_ID}" --format='value(status.url)')"
          fi
          # Suite web Pro hors @flaky. @pharmacy exclu tant que PHARMACY_ENABLED+seed CNK absents sur Cloud Run (S6).
          echo "PLAYWRIGHT_BASE_URL=${FE_URL} PETSFOLLOW_API_URL=${PETSFOLLOW_API_URL}"
          PLAYWRIGHT_BASE_URL="${FE_URL}" npx playwright test --grep-invert '@flaky|@pharmacy'

  cleanup-quality:
    name: Purge artefacts smoke/e2e (staging DB)
    # Toujours purger si le deploy a démarré : même en échec/cancel (le smoke postdeploy
    # mutatif a pu tourner avant) et même si Playwright fail/cancelled/skipped.
    # deploy skipped (job quality rouge) = rien n'a mutaté staging → pas de purge inutile.
    needs: [deploy, playwright]
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Cleanup staging quality data
        run: |
          chmod +x infra/gcp/cleanup-staging-quality.sh \
            scripts/cleanup-staging-quality.sh \
            scripts/cleanup-staging-invoicing.sh \
            scripts/lib/pf-staging-cleanup-guard.sh
          bash infra/gcp/cleanup-staging-quality.sh
