name: Deploy GCP production

# Déployer manuellement tant que le cutover n’est pas validé.
# Pour activer le push main, décommenter le bloc push ci-dessous.
#
# Quality : smoke post-deploy uniquement (SMOKE_PROFILE=prod).
# La suite complète (Go/Nuxt/Flutter/Playwright) tourne sur PR + staging.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-petsfollow-gcp-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: premedica-prod-2025
  GCP_RUN_REGION: europe-west9
  PETSFOLLOW_PUBLIC_SITE_URL: https://petsfollow.app
  PETSFOLLOW_API_PUBLIC_URL: https://api.petsfollow.app
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/237481297060/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  GCP_SERVICE_ACCOUNT: github-petsfollow-deploy@premedica-prod-2025.iam.gserviceaccount.com

jobs:
  deploy:
    name: Cloud Build → petsFollow API + Nuxt (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Preflight GCP (secrets + Ready + baseline)
        env:
          SKIP_BASELINE: ${{ vars.SKIP_BASELINE || '0' }}
        run: |
          chmod +x infra/gcp/*.sh infra/gcp/lib/*.sh 2>/dev/null || true
          bash infra/gcp/preflight-deploy.sh --env prod
      - name: Deploy (Cloud Build prod)
        run: |
          chmod +x infra/gcp/*.sh infra/gcp/lib/*.sh 2>/dev/null || true
          # AFMPS object key : SM petsfollow-prod-afmps-import-object-key (pf_resolve, fail-closed).
          gcloud builds submit --config=infra/gcp/cloudbuild-prod.yaml --project="${GCP_PROJECT_ID}" .
      - name: Summary
        run: |
          API_URL="$(gcloud run services describe petsfollow-api-prod \
            --region="${GCP_RUN_REGION}" --project="${GCP_PROJECT_ID}" \
            --format='value(status.url)' 2>/dev/null || true)"
          FE_URL="$(gcloud run services describe petsfollow-nuxtjs-prod \
            --region="${GCP_RUN_REGION}" --project="${GCP_PROJECT_ID}" \
            --format='value(status.url)' 2>/dev/null || true)"
          {
            echo "### petsFollow GCP production"
            echo ""
            echo "| Service | URL |"
            echo "|---------|-----|"
            echo "| Site | ${PETSFOLLOW_PUBLIC_SITE_URL} |"
            echo "| API custom | ${PETSFOLLOW_API_PUBLIC_URL} |"
            echo "| API Run | ${API_URL} |"
            echo "| Frontend Run | ${FE_URL} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  smoke:
    name: Smoke prod (non-mutatif)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Smoke API prod
        env:
          SMOKE_PROFILE: prod
        run: |
          API_URL="${PETSFOLLOW_API_PUBLIC_URL}"
          if ! curl -fsS --max-time 10 "${API_URL}/health" >/dev/null 2>&1; then
            API_URL="$(gcloud run services describe petsfollow-api-prod \
              --region="${GCP_RUN_REGION}" --project="${GCP_PROJECT_ID}" \
              --format='value(status.url)')"
            echo "→ Domaine custom pas prêt — smoke via Cloud Run URL"
          fi
          PETSFOLLOW_API_URL="${API_URL}" bash scripts/smoke-test.sh
