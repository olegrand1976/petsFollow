name: Deploy GCP production

# Prêt pour main, **pas encore auto** : activer le push quand SQL/DNS/secrets prod sont OK.
# Voir documentation/10-GCP-DEPLOIEMENT.md § Production (main).
on:
  workflow_dispatch:
  # Décommenter pour activer le deploy auto sur main :
  # push:
  #   branches: [main]

concurrency:
  group: deploy-petsfollow-gcp-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: premedica-prod-2025
  GCP_RUN_REGION: europe-west9
  PETSFOLLOW_PUBLIC_SITE_URL: https://petsfollow.app
  PETSFOLLOW_API_PUBLIC_URL: https://api.petsfollow.app
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/237481297060/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  GCP_SERVICE_ACCOUNT: github-petsfollow-deploy@premedica-prod-2025.iam.gserviceaccount.com

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Cloud Build → petsFollow API + Nuxt (production)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # environment: production  # activer protection GitHub Environment si besoin
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Deploy production (Cloud Build)
        run: |
          chmod +x infra/gcp/*.sh infra/gcp/lib/*.sh 2>/dev/null || true
          gcloud builds submit --config=infra/gcp/cloudbuild-prod.yaml --project="${GCP_PROJECT_ID}" .
      - name: Summary
        run: |
          API_URL="$(gcloud run services describe petsfollow-api-prod \
            --region="${GCP_RUN_REGION}" --project="${GCP_PROJECT_ID}" \
            --format='value(status.url)' 2>/dev/null || true)"
          FE_URL="$(gcloud run services describe petsfollow-nuxtjs-prod \
            --region="${GCP_RUN_REGION}" --project="${GCP_PROJECT_ID}" \
            --format='value(status.url)' 2>/dev/null || true)"
          {
            echo "### petsFollow GCP **production**"
            echo ""
            echo "| Service | URL |"
            echo "|---------|-----|"
            echo "| Site | ${PETSFOLLOW_PUBLIC_SITE_URL} |"
            echo "| API custom | ${PETSFOLLOW_API_PUBLIC_URL} |"
            echo "| API Run | ${API_URL} |"
            echo "| Frontend Run | ${FE_URL} |"
            echo ""
            echo "Play AAB : \`make play-android-bundle-prod\` (API_BASE=${PETSFOLLOW_API_PUBLIC_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"
